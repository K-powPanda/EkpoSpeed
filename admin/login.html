<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKPO Speed Performance - Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #080808;
      --dark: #111111;
      --card: #161616;
      --orange: #FF5E00;
      --orange-bright: #FF7A20;
      --gold: #FFB800;
      --white: #FFFFFF;
      --grey: #AAAAAA;
      --border: rgba(255,255,255,0.08);
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(255,94,0,0.12), transparent 35%),
        radial-gradient(circle at 80% 15%, rgba(255,184,0,0.1), transparent 28%),
        var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 32px;
    }

    .eyebrow {
      color: var(--orange);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 span { color: var(--orange); }

    p {
      color: var(--grey);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: var(--gold);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--dark);
      border: 1px solid var(--border);
      color: var(--white);
      font: inherit;
      padding: 14px 16px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus { border-color: rgba(255,94,0,0.55); }

    button {
      width: 100%;
      border: 0;
      background: var(--orange);
      color: var(--white);
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 18px;
    }

    button:hover { background: var(--orange-bright); }
    button:disabled { cursor: wait; opacity: 0.7; }

    .error {
      min-height: 22px;
      color: var(--red);
      font-size: 0.92rem;
      margin-top: 14px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="eyebrow">Admin Portal</div>
    <h1>EKPO <span>Speed</span></h1>
    <p>Sign in to view athlete registrations, training demand, payment status, and availability trends.</p>

    <form id="login-form">
      <label for="password">Admin Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="login-button" type="submit">Enter Dashboard</button>
      <p class="error" id="error" aria-live="polite"></p>
    </form>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const button = document.getElementById('login-button');
      const error = document.getElementById('error');
      const password = document.getElementById('password').value;

      button.disabled = true;
      button.textContent = 'Checking...';
      error.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password })
        });

        if (!res.ok) {
          error.textContent = res.status === 401 ? 'Invalid password.' : 'Admin login is not configured.';
          return;
        }

        window.location.href = '/admin/';
      } catch (err) {
        error.textContent = 'Could not reach the admin service.';
      } finally {
        button.disabled = false;
        button.textContent = 'Enter Dashboard';
      }
    });
  </script>
</body>
</html>
